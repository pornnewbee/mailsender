name: Send Email via MX (Custom Domain)

on:
  workflow_dispatch:
    inputs:
      to_email:
        description: 'Recipient email'
        required: true
      subject:
        description: 'Email subject'
        required: true
      body:
        description: 'Email body'
        required: true

jobs:
  send_email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install dnspython dkimpy

      - name: Send email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}      # 你的邮箱，例如 mail@yourdomain.com
          SMTP_PASS: ${{ secrets.SMTP_PASS }}      # SMTP 密码
          DKIM_SELECTOR: ${{ secrets.DKIM_SELECTOR }}  # DKIM selector
          DKIM_DOMAIN: ${{ secrets.DKIM_DOMAIN }}      # 你的域名
          DKIM_PRIVATE_KEY: ${{ secrets.DKIM_PRIVATE_KEY }} # DKIM 私钥
        run: |
          python - << 'EOF'
          import os
          import smtplib
          import dns.resolver
          from email.message import EmailMessage
          import dkim

          # 获取输入
          to_email = '${{ github.event.inputs.to_email }}'
          subject = '${{ github.event.inputs.subject }}'
          body = '${{ github.event.inputs.body }}'

          SMTP_USER = os.environ['SMTP_USER']
          SMTP_PASS = os.environ['SMTP_PASS']
          DKIM_SELECTOR = os.environ['DKIM_SELECTOR']
          DKIM_DOMAIN = os.environ['DKIM_DOMAIN']
          DKIM_PRIVATE_KEY = os.environ['DKIM_PRIVATE_KEY'].encode()

          # 获取收件人 MX
          recipient_domain = to_email.split('@')[1]
          answers = dns.resolver.resolve(recipient_domain, 'MX')
          mx_hosts = sorted([(r.preference, r.exchange.to_text()) for r in answers])
          mx_host = mx_hosts[0][1].rstrip('.')  # 优先级最高的 MX
          print(f"Using MX {mx_host} for domain {recipient_domain}")

          # 创建邮件
          msg = EmailMessage()
          msg['From'] = SMTP_USER
          msg['To'] = to_email
          msg['Subject'] = subject
          msg.set_content(body)

          # DKIM 签名
          headers = [b"From", b"To", b"Subject"]
          sig = dkim.sign(
              message=msg.as_bytes(),
              selector=DKIM_SELECTOR.encode(),
              domain=DKIM_DOMAIN.encode(),
              privkey=DKIM_PRIVATE_KEY,
              include_headers=headers
          )
          msg_bytes = sig + msg.as_bytes()

          # 发送邮件（STARTTLS）
          with smtplib.SMTP(mx_host, 25) as server:
              server.starttls()
              server.login(SMTP_USER, SMTP_PASS)
              server.sendmail(SMTP_USER, [to_email], msg_bytes)

          print(f"Email successfully sent to {to_email}")
          EOF
