name: Direct MX Mail Sender

on:
  workflow_dispatch:
    inputs:
      to_email:
        description: '收件人邮箱'
        required: true
      subject:
        description: '邮件主题'
        required: true
      body:
        description: '邮件内容'
        required: true

jobs:
  send_email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install dnspython dkimpy

      - name: Send email directly to MX
        env:
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}          # 你的域名邮箱
          DKIM_SELECTOR: ${{ secrets.DKIM_SELECTOR }}    # DKIM selector
          DKIM_DOMAIN: ${{ secrets.DKIM_DOMAIN }}        # 域名
          DKIM_PRIVATE_KEY: ${{ secrets.DKIM_PRIVATE_KEY }} # DKIM 私钥内容
        run: |
          python - << 'EOF'
          import os
          import smtplib
          import dns.resolver
          from email.message import EmailMessage
          import dkim

          # 输入参数
          to_email = '${{ github.event.inputs.to_email }}'
          subject = '${{ github.event.inputs.subject }}'
          body = '${{ github.event.inputs.body }}'

          from_email = os.environ['FROM_EMAIL']
          DKIM_SELECTOR = os.environ['DKIM_SELECTOR']
          DKIM_DOMAIN = os.environ['DKIM_DOMAIN']
          DKIM_PRIVATE_KEY = os.environ['DKIM_PRIVATE_KEY'].encode()

          # 查询收件人 MX
          domain = to_email.split('@')[1]
          answers = dns.resolver.resolve(domain, 'MX')
          mx_hosts = sorted([(r.preference, r.exchange.to_text()) for r in answers])
          mx_host = mx_hosts[0][1].rstrip('.')
          print(f"直连 MX: {mx_host}")

          # 创建邮件
          msg = EmailMessage()
          msg['From'] = from_email
          msg['To'] = to_email
          msg['Subject'] = subject
          msg.set_content(body)

          # DKIM 签名
          headers = [b"From", b"To", b"Subject"]
          sig = dkim.sign(
              message=msg.as_bytes(),
              selector=DKIM_SELECTOR.encode(),
              domain=DKIM_DOMAIN.encode(),
              privkey=DKIM_PRIVATE_KEY,
              include_headers=headers
          )
          msg_bytes = sig + msg.as_bytes()

          # 发送邮件
          try:
              with smtplib.SMTP(mx_host, 25, timeout=10) as server:
                  try:
                      server.starttls()
                      print("STARTTLS 已启用")
                  except Exception:
                      print("对方 MX 不支持 STARTTLS")
                  server.sendmail(from_email, [to_email], msg_bytes)
              print(f"邮件已发送到 {to_email}")
          except Exception as e:
              print(f"发送失败: {e}")
          EOF
